<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Parallaxis 示例导航，查看滚动驱动的 DOM 与 WebGL 视差动画。"
    />
    <title>Parallaxis Examples</title>
    <style>
      * {
        box-sizing: border-box;
      }

      :root {
        color: #eaf5ff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #030812;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at 18% 12%, rgba(38, 139, 220, 0.2), transparent 34%),
          radial-gradient(circle at 82% 78%, rgba(54, 225, 196, 0.1), transparent 32%),
          #030812;
      }

      main {
        width: min(1080px, calc(100% - 40px));
        margin: 0 auto;
        padding: clamp(72px, 12vw, 144px) 0;
      }

      header {
        max-width: 760px;
        margin-bottom: 56px;
      }

      .eyebrow {
        margin: 0 0 16px;
        color: #77e7ff;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 20px;
        font-size: clamp(48px, 9vw, 92px);
        line-height: 0.95;
      }

      header p:last-child {
        margin: 0;
        color: rgba(218, 235, 247, 0.72);
        font-size: 18px;
        line-height: 1.7;
      }

      .examples {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
        gap: 24px;
      }

      .example-card {
        position: relative;
        display: flex;
        min-height: 310px;
        padding: 32px;
        overflow: hidden;
        color: inherit;
        text-decoration: none;
        background:
          linear-gradient(145deg, rgba(14, 36, 62, 0.92), rgba(5, 15, 29, 0.92));
        border: 1px solid rgba(132, 210, 255, 0.22);
        border-radius: 18px;
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.28);
        transition: border-color 180ms ease, transform 180ms ease;
      }

      .example-card::before {
        position: absolute;
        inset: -40% -20% auto auto;
        width: 280px;
        aspect-ratio: 1;
        content: "";
        background: radial-gradient(circle, rgba(255, 196, 77, 0.48), rgba(255, 92, 46, 0.14) 30%, transparent 66%);
        border-radius: 50%;
      }

      .example-card:hover,
      .example-card:focus-visible {
        border-color: rgba(119, 231, 255, 0.7);
        outline: none;
        transform: translateY(-4px);
      }

      .card-content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }

      .tag {
        align-self: flex-start;
        margin-bottom: auto;
        padding: 7px 10px;
        color: #9cecff;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: rgba(89, 214, 255, 0.08);
        border: 1px solid rgba(119, 231, 255, 0.2);
        border-radius: 999px;
      }

      h2 {
        margin: 48px 0 12px;
        font-size: 32px;
      }

      .card-content p {
        margin: 0;
        color: rgba(218, 235, 247, 0.7);
        line-height: 1.65;
      }

      .open-label {
        margin-top: 24px;
        color: #a8f3ff;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Scroll-driven animation library</p>
        <h1>Parallaxis Examples</h1>
        <p>从独立场景中观察滚动位置如何映射为位移、缩放、旋转与透明度。</p>
      </header>

      <section class="examples" aria-label="示例列表">
        <a class="example-card" href="./solar-system/">
          <div class="card-content">
            <span class="tag">React · Three.js</span>
            <h2>Solar System</h2>
            <p>组合 ScrollParallax 与 Parallaxis 运行时，用滚动脚本控制 DOM 叙事层和 WebGL 太阳系。</p>
            <span class="open-label">打开示例 →</span>
          </div>
        </a>

        <a class="example-card example-card-plane" href="./stylized-plane/">
          <div class="card-content">
            <span class="tag">Three.js · GLTFLoader</span>
            <h2>Stylized Plane</h2>
            <p>加载双翼螺旋桨飞机 GLB 模型，建立后续滚动飞行动画的基础三维场景。</p>
            <span class="open-label">打开示例 →</span>
          </div>
        </a>
      </section>
    </main>
  </body>
</html>
